name: Deploy Jekyll site to Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          cache-version: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.11.0'

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Check EdgeOne CLI version
        run: npx --yes edgeone@latest -v

      - name: Deploy to EdgeOne Pages
        shell: bash
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
        run: |
          for attempt in 1 2 3; do
            echo "EdgeOne deployment attempt ${attempt}/3"

            set +e
            OUTPUT=$(npx --yes edgeone@latest pages deploy ./_site -n anssl-blog -t "$EDGEONE_API_TOKEN" 2>&1)
            STATUS=$?
            set -e

            echo "$OUTPUT"

            if [ "$STATUS" -eq 0 ]; then
              echo "EdgeOne deployment succeeded."
              exit 0
            fi

            if ! echo "$OUTPUT" | grep -Eq '522|DescribePagesEncipherToken'; then
              echo "Non-transient EdgeOne error. Stop retrying."
              exit "$STATUS"
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "EdgeOne API returned 522. Retrying..."
              sleep 15
            fi
          done

          echo "EdgeOne deployment failed after 3 attempts."
          exit 1

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
